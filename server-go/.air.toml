root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  entrypoint = "./tmp/main"
  delay = 500
  include_dir = [".", "config", "db", "middleware", "modules"]
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  kill_delay = "200ms"
  send_interrupt = true

[log]
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
